<!DOCTYPE html>
<html lang="en">
<head>

  <meta property="og:description" content="AI and Data Science Professional. Exploring innovative solutions and sharing insights on the latest trends in technology." />

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── CSS Custom Properties (from original theme) ── */
    :root {
      --profileBackground: #474C50;
      --desktop-frame-color: color-mix(in srgb, #474C50 88%, white 12%);
      --bodyText: #e5e5e5;
      --header-text-color: #e5e5e5;
      --button-style-text: #ffffff;
      --button-style-background: transparent;
      --button-style-border-color: #ffffff;
      --button-style-radius: 28px;
      --socialLinkFill: #e5e5e5;
      --link-gap: 14px;
      --profileFontFamilyPrimary: 'Manrope', sans-serif;
      --profileFontFamilySecondary: 'Inter', sans-serif;
    }

    body {
      font-family: var(--profileFontFamilyPrimary);
      background-color: var(--profileBackground);
      color: var(--bodyText);
      min-height: 100vh;
      line-height: 1;
    }

    /* ── Desktop wrapper ── */
    @media (min-width: 576px) {
      body { background-color: var(--desktop-frame-color); }
    }

    .page-wrapper {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    @media (min-width: 576px) {
      .page-wrapper {
        margin-top: 40px;
        min-height: calc(100vh - 40px);
        border-radius: 24px 24px 0 0;
        background-color: var(--profileBackground);
        box-shadow: 0 24px 32px 0 rgba(0,0,0,0.15);
        overflow: hidden;
      }
    }

    /* ── Top Bar ── */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      padding: var(--link-gap);
      pointer-events: none;
    }
    @media (min-width: 576px) {
      .topbar {
        position: absolute;
        top: 14px;
        padding: var(--link-gap) calc(var(--link-gap) * 2);
      }
    }
    .topbar-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar-btn {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 16px;
      border: none;
      outline: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.15);
      backdrop-filter: blur(16px) brightness(0.72);
      -webkit-backdrop-filter: blur(16px) brightness(0.72);
      color: white;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .topbar-btn:active { transform: scale(0.95); }

    /* ── Profile Header Section ── */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
      position: relative;
    }

    /* ── Profile Title (behind avatar) ── */
    .profile-title {
      text-align: center;
      font-family: var(--profileFontFamilyPrimary);
      font-weight: 600;
      font-size: 3.75rem;
      line-height: 0.95;
      color: var(--header-text-color);
      margin-bottom: -20px;
      z-index: 0;
      overflow-wrap: break-word;
      padding: 0 24px;
    }

    /* ── Avatar with fade-out mask ── */
    .avatar-container {
      width: 100%;
      max-width: 100%;
      position: relative;
      z-index: 1;
      overflow: hidden;
      mask: radial-gradient(110.26% 100% at 50% 0%,
        #000 60%,
        rgba(0,0,0,0.99) 64.72%,
        rgba(0,0,0,0.97) 68.55%,
        rgba(0,0,0,0.93) 71.65%,
        rgba(0,0,0,0.88) 74.13%,
        rgba(0,0,0,0.82) 76.15%,
        rgba(0,0,0,0.75) 77.82%,
        rgba(0,0,0,0.67) 79.3%,
        rgba(0,0,0,0.59) 80.7%,
        rgba(0,0,0,0.50) 82.18%,
        rgba(0,0,0,0.41) 83.85%,
        rgba(0,0,0,0.33) 85.87%,
        rgba(0,0,0,0.24) 88.35%,
        rgba(0,0,0,0.15) 91.45%,
        rgba(0,0,0,0.07) 95.28%,
        rgba(0,0,0,0.00) 100%
      );
      -webkit-mask: radial-gradient(110.26% 100% at 50% 0%,
        #000 60%,
        rgba(0,0,0,0.99) 64.72%,
        rgba(0,0,0,0.97) 68.55%,
        rgba(0,0,0,0.93) 71.65%,
        rgba(0,0,0,0.88) 74.13%,
        rgba(0,0,0,0.82) 76.15%,
        rgba(0,0,0,0.75) 77.82%,
        rgba(0,0,0,0.67) 79.3%,
        rgba(0,0,0,0.59) 80.7%,
        rgba(0,0,0,0.50) 82.18%,
        rgba(0,0,0,0.41) 83.85%,
        rgba(0,0,0,0.33) 85.87%,
        rgba(0,0,0,0.24) 88.35%,
        rgba(0,0,0,0.15) 91.45%,
        rgba(0,0,0,0.07) 95.28%,
        rgba(0,0,0,0.00) 100%
      );
    }
    @media (min-width: 576px) {
      .avatar-container { border-radius: 24px 24px 0 0; }
    }
    .avatar-img {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      display: block;
    }

    /* ── Profile Info (name & bio below avatar) ── */
    .profile-info {
      text-align: center;
      padding: 0 24px;
      margin-top: -10px;
    }
    .profile-name {
      font-family: var(--profileFontFamilyPrimary);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--header-text-color);
      margin-bottom: 6px;
    }
    .profile-bio {
      font-family: var(--profileFontFamilySecondary);
      font-weight: 500;
      font-size: 0.875rem;
      color: var(--bodyText);
      line-height: 1.5;
      max-width: 420px;
      margin: 0 auto;
      opacity: 0.85;
    }

    /* ── Social Icons Row ── */
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
      padding: 0 16px;
    }
    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: var(--socialLinkFill);
      transition: transform 0.2s ease, opacity 0.2s ease;
      text-decoration: none;
      border-radius: 50%;
    }
    .social-icon:hover {
      transform: scale(1.15);
      opacity: 0.8;
    }
    .social-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* ── Link Buttons ── */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: var(--link-gap);
      padding: 24px var(--link-gap);
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }
    @media (min-width: 576px) {
      .links-container {
        padding: 24px calc(var(--link-gap) * 2);
      }
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      min-height: 56px;
      padding: 16px 56px;
      background: var(--button-style-background);
      border: 1px solid var(--button-style-border-color);
      border-radius: var(--button-style-radius);
      color: var(--button-style-text);
      font-family: var(--profileFontFamilySecondary);
      font-weight: 500;
      font-size: 1rem;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      word-break: break-word;
    }
    .link-btn:hover {
      background: rgba(255,255,255,0.07);
      transform: scale(1.02);
    }
    .link-btn:active {
      transform: scale(0.98);
    }

    /* Link button icon (left side) */
    .link-btn-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .link-btn-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Footer / Linktree branding ── */
    .footer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px 48px;
      gap: 8px;
    }
    .footer-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--bodyText);
      text-decoration: none;
      font-family: var(--profileFontFamilySecondary);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      opacity: 0.5;
      transition: opacity 0.2s ease;
    }
    .footer-logo:hover { opacity: 0.8; }
    .footer-logo svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }


  </style>
</head>
